admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: public_http
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: gateway
                codec_type: AUTO
                # Habilita el Upgrade de HTTP/1.1 a WebSocket en el listener.
                # Sin esto, la ruta /v1/ws no puede activarlo por su cuenta y el
                # handshake se responde como una petición normal. Qué rutas lo
                # usan se decide abajo, ruta por ruta.
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      # Política CORS aplicada a todas las rutas de este vhost;
                      # el filtro envoy.filters.http.cors de abajo es el que la hace cumplir.
                      cors:
                        allow_origin_string_match:
                          - safe_regex:
                              regex: ".*"
                        allow_methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                        allow_headers: "content-type,authorization,x-requested-with"
                        max_age: "1728000"
                      routes:
                        # Los filtros cors y ratelimit resuelven la ruta ANTES de
                        # que grpc_json_transcoder reescriba :path a la forma gRPC
                        # (corren antes que él en la cadena), así que ven siempre
                        # el path REST original. Por eso estas rutas cubren tanto el
                        # preflight OPTIONS como las llamadas reales, y es aquí
                        # donde va el rate limiting (habla con el ratelimit-service,
                        # que guarda los contadores en Valkey).
                        #
                        # Cada ruta declara además su CLASE con un generic_key, y
                        # el límite se define por clase en
                        # gateway/ratelimit/config/gateway.yaml. Sin esa clase todo
                        # el tráfico compartía un único presupuesto, y un intento
                        # de login costaba lo mismo que leer el catálogo de
                        # géneros. La IP viaja como segunda entrada del
                        # descriptor, así que el límite sigue siendo por cliente
                        # dentro de su clase.
                        #
                        # Login va con su propia clase y en `path` exacto, antes
                        # del prefijo /v1/auth: es el único endpoint donde cada
                        # petición es un intento de adivinar una credencial.
                        - match: { path: "/v1/auth/login" }
                          route:
                            cluster: user_service
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: route
                                      descriptor_value: auth
                                  - remote_address: {}
                        # El resto de autenticacion (me / logout) y el CRUD de
                        # usuarios: sin clase propia, van al presupuesto general.
                        - match: { prefix: "/v1/auth" }
                          route:
                            cluster: user_service
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: route
                                      descriptor_value: default
                                  - remote_address: {}
                        - match: { prefix: "/v1/users" }
                          route:
                            cluster: user_service
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: route
                                      descriptor_value: default
                                  - remote_address: {}
                        # Libros y sagas, con capítulos, géneros e interacciones
                        # anidados bajo el libro. Se parten en dos por método: un
                        # lector navegando encadena muchos GET seguidos y todos
                        # salen del cache, mientras que las escrituras siguen con
                        # el presupuesto estrecho. El match por :method va primero;
                        # lo que no sea GET cae en la ruta de abajo.
                        - match:
                            prefix: "/v1/books"
                            headers:
                              - name: ":method"
                                string_match: { exact: "GET" }
                          route:
                            cluster: library_service
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: route
                                      descriptor_value: read
                                  - remote_address: {}
                        - match: { prefix: "/v1/books" }
                          route:
                            cluster: library_service
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: route
                                      descriptor_value: default
                                  - remote_address: {}
                        - match:
                            prefix: "/v1/sagas"
                            headers:
                              - name: ":method"
                                string_match: { exact: "GET" }
                          route:
                            cluster: library_service
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: route
                                      descriptor_value: read
                                  - remote_address: {}
                        - match: { prefix: "/v1/sagas" }
                          route:
                            cluster: library_service
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: route
                                      descriptor_value: default
                                  - remote_address: {}
                        # Catálogo de géneros: lista fija, pública y cacheada. Es
                        # de solo lectura, así que no hace falta partirla por
                        # método.
                        - match: { prefix: "/v1/genres" }
                          route:
                            cluster: library_service
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: route
                                      descriptor_value: catalog
                                  - remote_address: {}
                        # WebSocket de interacciones en tiempo real. Va ANTES de
                        # cualquier otra cosa que pudiera capturarlo y tiene tres
                        # particularidades:
                        #
                        #  - Cluster propio (interaction_ws): apunta al puerto
                        #    HTTP/1.1 del servicio, no al de gRPC. Un WebSocket
                        #    no se puede multiplexar sobre HTTP/2 hacia gRPC.
                        #  - upgrade_configs: sin esto Envoy trataría el
                        #    handshake como una petición normal y lo cerraría.
                        #  - timeout 0: la conexión está abierta por definición;
                        #    el timeout por defecto la cortaría a los 15s.
                        #
                        # /v1/ws no es un método gRPC, así que con la config
                        # global del transcoder (reject_unknown_method) éste
                        # respondería 404 antes de que el router llegue a
                        # enrutarlo. Se le da a la ruta su propia config con los
                        # rechazos apagados: así el transcoder no encuentra
                        # método, no rechaza, y deja pasar la petición tal cual
                        # hacia el cluster de abajo.
                        #
                        # No sirve desactivar el filtro con el
                        # envoy.config.route.v3.FilterConfig genérico: el
                        # transcoder resuelve su config por ruta buscando su
                        # propio tipo y no llega a ver ese "disabled".
                        - match: { prefix: "/v1/ws/" }
                          route:
                            cluster: interaction_ws
                            timeout: 0s
                            upgrade_configs:
                              - upgrade_type: websocket
                                enabled: true
                            # Lo que se limita aquí es abrir la conexión, no lo
                            # que viaja después: una vez hecho el upgrade, el
                            # tráfico ya no vuelve a pasar por el filtro.
                            rate_limits:
                              - actions:
                                  - generic_key:
                                      descriptor_key: route
                                      descriptor_value: ws
                                  - remote_address: {}
                          typed_per_filter_config:
                            envoy.filters.http.grpc_json_transcoder:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                              proto_descriptor: "/etc/envoy/proto/services.pb"
                              services:
                                - "interaction.v1.InteractionService"
                              request_validation_options:
                                reject_unknown_method: false
                                reject_unknown_query_parameters: false
                        # RPCs internos de servicio a servicio: no llevan anotación
                        # HTTP, pero la ruta de passthrough de abajo aceptaría gRPC
                        # crudo desde fuera igual. Se bloquean aquí, antes de ella.
                        # Los vecinos los llaman directo a user-service:50051, sin
                        # pasar por el gateway.
                        - match: { path: "/user.v1.UserService/ValidateSession" }
                          direct_response:
                            status: 404
                            body:
                              inline_string: "not found"
                        # Borra todos los libros y las sagas de un usuario. Solo la
                        # llama user-service al dar de baja una cuenta; desde
                        # fuera sería un borrado masivo sin más credencial que
                        # un user_id, que es público.
                        - match: { path: "/library.v1.LibraryService/DeleteAuthorContent" }
                          direct_response:
                            status: 404
                            body:
                              inline_string: "not found"
                        # Borrados masivos de interacciones. Los llaman
                        # user-service (baja de cuenta) y library-service
                        # (borrado de libro), directo al 50053. Desde fuera
                        # serían un borrado masivo con solo un id por credencial.
                        - match: { path: "/interaction.v1.InteractionService/DeleteUserInteractions" }
                          direct_response:
                            status: 404
                            body:
                              inline_string: "not found"
                        - match: { path: "/interaction.v1.InteractionService/DeleteBookInteractions" }
                          direct_response:
                            status: 404
                            body:
                              inline_string: "not found"
                        # El transcoder sí invalida el caché de ruta tras reescribir
                        # el path, así que el router vuelve a resolver — esta vez
                        # contra el path gRPC ya transcodificado.
                        - match: { prefix: "/user.v1.UserService/" }
                          route:
                            cluster: user_service
                            timeout: 15s
                        - match: { prefix: "/library.v1.LibraryService/" }
                          route:
                            cluster: library_service
                            timeout: 15s
                        # Ésta es la ruta que de verdad decide el upstream de las
                        # interacciones: sus paths REST cuelgan de /v1/books, que
                        # arriba resuelve a library_service, pero eso solo aplica
                        # a CORS y rate limiting. El transcoder reescribe el path
                        # a su forma gRPC e invalida el caché de ruta, y el
                        # router vuelve a resolver — esta vez contra este prefijo.
                        - match: { prefix: "/interaction.v1.InteractionService/" }
                          route:
                            cluster: interaction_service
                            timeout: 15s
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                      domain: gateway
                      failure_mode_deny: false
                      timeout: 0.5s
                      rate_limit_service:
                        transport_api_version: V3
                        grpc_service:
                          envoy_grpc:
                            cluster_name: ratelimit_service
                  # Va antes del transcoder en la cadena de request, así que en
                  # la de response corre DESPUÉS de él — que es cuando agrega
                  # grpc-status/grpc-message a la respuesta ya transcodificada.
                  # convert_grpc_status solo los limpia en el camino de error;
                  # esto los saca también cuando el status gRPC es OK.
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        response_mutations:
                          - remove: "grpc-status"
                          - remove: "grpc-message"
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      # Un solo descriptor con todos los servicios: el filtro
                      # admite uno nada más. Lo genera `make proto-descriptor`
                      # en la raíz del monorepo.
                      proto_descriptor: "/etc/envoy/proto/services.pb"
                      services:
                        - "user.v1.UserService"
                        - "library.v1.LibraryService"
                        - "interaction.v1.InteractionService"
                      # Sin esto, el status y mensaje gRPC quedan como headers
                      # crudos (grpc-status/grpc-message) en la respuesta HTTP;
                      # con esto, el transcoder los traduce a un status HTTP real
                      # (y a un body de error JSON estándar si algo falla).
                      convert_grpc_status: true
                      # Sin esto, un parámetro de query que no existe en el
                      # mensaje hace fallar la transcodificación en silencio: la
                      # petición sigue como gRPC crudo hacia el servicio y el
                      # cliente recibe un 415 con el cuerpo vacío, sin pista de
                      # qué estuvo mal. Con la validación activa, el gateway
                      # responde un 400 que dice cuál es el parámetro.
                      request_validation_options:
                        reject_unknown_query_parameters: true
                        # Misma razón: una ruta bajo un prefijo enrutado aquí
                        # (p. ej. /v1/books/loquesea) que no corresponda a
                        # ningún método seguiría como gRPC crudo hacia el
                        # servicio y devolvería un 415 mudo. Con esto el
                        # gateway responde 404 y dice que el método no existe.
                        # No afecta al passthrough de gRPC real: el transcoder
                        # no toca las peticiones con content-type
                        # application/grpc.
                        reject_unknown_method: true
                      print_options:
                        add_whitespace: true
                        always_print_primitive_fields: true
                        preserve_proto_field_names: false
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: user_service
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: user_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: user-service, port_value: 50051 }

    - name: library_service
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: library_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: library-service, port_value: 50052 }

    - name: interaction_service
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: interaction_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: interaction-service, port_value: 50053 }

    # El mismo servicio, pero por su puerto HTTP. Va en un cluster aparte y NO
    # lleva http2_protocol_options: un WebSocket se negocia con el Upgrade de
    # HTTP/1.1, que sobre HTTP/2 no existe.
    - name: interaction_ws
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: interaction_ws
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: interaction-service, port_value: 8090 }

    - name: ratelimit_service
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: ratelimit_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: ratelimit, port_value: 8081 }
