syntax = "proto3";

package users.v1;

option go_package = "github.com/estebandeveloper20/lectonautas/backend/microservices/users-service/proto/users/v1;usersv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service UsersService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }
  rpc GetUser(GetUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      get: "/v1/users/{id}"
    };
  }
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      patch: "/v1/users/{id}"
      body: "*"
    };
  }
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/v1/users/{id}"
    };
  }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }

  // Autenticacion basada en tokens de sesion.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }
  // Devuelve el usuario dueno del token enviado en el header Authorization.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      get: "/v1/auth/me"
    };
  }
  // Revoca la sesion del token enviado en el header Authorization.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }
}

// El password nunca se expone: solo se acepta al crear el usuario.
message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string display_name = 4;
  string avatar_url = 5;
  string bio = 6;
  bool is_active = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateUserRequest {
  string email = 1;
  string username = 2;
  string password = 3;
  string display_name = 4;
  string avatar_url = 5;
  string bio = 6;
}

message GetUserRequest {
  string id = 1;
}

// Actualizacion parcial: los campos ausentes se dejan como estan y una cadena
// vacia limpia el campo. El email no se cambia por aqui porque es credencial
// de acceso y requiere un flujo de verificacion propio.
message UpdateUserRequest {
  string id = 1;
  optional string username = 2;
  optional string display_name = 3;
  optional string avatar_url = 4;
  optional string bio = 5;
  optional bool is_active = 6;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

message UserResponse {
  User user = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

// El token va en crudo: es la unica vez que el cliente lo recibe. Debe
// enviarlo luego en el header "Authorization: Bearer <token>".
message LoginResponse {
  string token = 1;
  User user = 2;
}

// El token no viaja en el body: se lee del header Authorization.
message GetCurrentUserRequest {}

message LogoutRequest {}

message LogoutResponse {
  bool success = 1;
}
