syntax = "proto3";

package user.v1;

option go_package = "github.com/EstebanTech/lectonautas/backend/microservices/user-service/proto/user/v1;userv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }
  // Devuelve el perfil publico: no lleva email ni is_active. Cualquiera puede
  // pedirlo, y el id de un autor viaja en cada libro, asi que lo que devuelve
  // este endpoint es efectivamente publico. Para los datos propios completos
  // esta GetCurrentUser, que exige token.
  rpc GetUser(GetUserRequest) returns (PublicUserResponse) {
    option (google.api.http) = {
      get: "/v1/users/{id}"
    };
  }
  // Solo el dueno de la cuenta, con su token. Devuelve el usuario completo
  // porque quien lo recibe es el propio dueno.
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      patch: "/v1/users/{id}"
      body: "*"
    };
  }
  // Da de baja la cuenta del llamante. Solo el dueno, con su token.
  //
  // Es un borrado en cascada y no tiene vuelta atras: se lleva sus sesiones y,
  // por gRPC contra library-service, sus libros con todos sus capitulos, sus
  // sagas y su biblioteca de guardados.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/v1/users/{id}"
    };
  }
  // Devuelve todos los usuarios, sin paginacion ni filtros. Perfiles publicos:
  // sin email ni is_active.
  rpc GetAllUsers(GetAllUsersRequest) returns (GetAllUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }

  // Autenticacion basada en tokens de sesion.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }
  // Devuelve el usuario dueno del token enviado en el header Authorization.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      get: "/v1/auth/me"
    };
  }
  // Revoca la sesion del token enviado en el header Authorization.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }

  // ValidateSession resuelve un token a su user_id. Es la puerta que usan los
  // demas servicios (library-service, etc.) para autenticar sin tener la tabla
  // de sesiones: la fuente de verdad de las sesiones vive solo aqui.
  //
  // A proposito NO lleva anotacion google.api.http, asi que no existe como
  // endpoint REST. Ojo: eso solo no la vuelve interna, porque el gateway tiene
  // una ruta de passthrough para gRPC crudo; queda bloqueada aparte en
  // envoy.yaml. Los vecinos la llaman directo a user-service:50051.
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
}

// User son los datos completos de la cuenta, incluido el email. Solo viaja
// hacia su propio dueno: CreateUser, Login, GetCurrentUser y UpdateUser. Todo
// lo que pueda pedir un tercero usa PublicUser.
//
// El password nunca se expone: solo se acepta al crear el usuario.
message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string display_name = 4;
  string avatar_url = 5;
  string bio = 6;
  bool is_active = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// PublicUser es el perfil que ve cualquiera: lo justo para mostrar la ficha de
// un autor junto a sus libros.
//
// Es un mensaje aparte y no un User con campos vacios a proposito. El email no
// existe en este tipo, asi que no hay forma de filtrarlo por descuido en un
// cambio futuro: no compilaria. Los numeros de campo se mantienen iguales a los
// de User para que las dos vistas se lean sin sorpresas.
//
// Fuera quedan a proposito:
//   - email: es la credencial de acceso y un dato personal.
//   - is_active: el estado de una cuenta no es asunto de terceros.
//   - updated_at: delata actividad de la cuenta sin aportar nada publico.
message PublicUser {
  string id = 1;
  string username = 3;
  string display_name = 4;
  string avatar_url = 5;
  string bio = 6;
  // Fecha de alta, para un "miembro desde" en la ficha del autor.
  google.protobuf.Timestamp created_at = 8;

  reserved 2, 7, 9;
  reserved "email", "is_active", "updated_at";
}

message CreateUserRequest {
  string email = 1;
  string username = 2;
  string password = 3;
  string display_name = 4;
  string avatar_url = 5;
  string bio = 6;
}

message GetUserRequest {
  string id = 1;
}

// Actualizacion parcial: los campos ausentes se dejan como estan y una cadena
// vacia limpia el campo. El email no se cambia por aqui porque es credencial
// de acceso y requiere un flujo de verificacion propio.
message UpdateUserRequest {
  string id = 1;
  optional string username = 2;
  optional string display_name = 3;
  optional string avatar_url = 4;
  optional string bio = 5;
  optional bool is_active = 6;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

// No lleva campos: siempre devuelve el listado completo.
message GetAllUsersRequest {}

message GetAllUsersResponse {
  // Perfiles publicos: este listado no lleva token, asi que no puede llevar
  // emails.
  repeated PublicUser users = 1;
  // total es simplemente cuantos usuarios trae la respuesta; se mantiene por
  // comodidad del cliente.
  int32 total = 2;
}

message UserResponse {
  User user = 1;
}

message PublicUserResponse {
  PublicUser user = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

// El token va en crudo: es la unica vez que el cliente lo recibe. Debe
// enviarlo luego en el header "Authorization: Bearer <token>".
message LoginResponse {
  string token = 1;
  User user = 2;
}

// El token no viaja en el body: se lee del header Authorization.
message GetCurrentUserRequest {}

message LogoutRequest {}

message LogoutResponse {
  bool success = 1;
}

// El token viaja en el cuerpo, no en el header: quien llama es otro servicio
// reenviando el token de su cliente, no el cliente mismo.
message ValidateSessionRequest {
  string token = 1;
}

message ValidateSessionResponse {
  string user_id = 1;
}
