syntax = "proto3";

package library.v1;

option go_package = "github.com/EstebanTech/lectonautas/backend/microservices/library-service/proto/library/v1;libraryv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// LibraryService es la obra del autor: libros, sus capitulos y las sagas que
// los agrupan. Lo que el lector hace con esa obra (guardarla, marcarla como
// favorita) no vive aqui: es otro dominio y va en su propio servicio.
//
// El token de sesion viaja en el header "Authorization: Bearer <token>" y se
// resuelve contra user-service (rpc ValidateSession), que es el unico dueno de
// la tabla de sesiones.
service LibraryService {
  // --- content: libros ----------------------------------------------------

  // Crea el libro vacio, sin capitulos. Los capitulos son un recurso aparte y
  // se agregan siempre por CreateChapter, incluido el primero: el libro y su
  // contenido se editan por separado.
  //
  // Por eso no se puede nacer publicado — un libro vacio se queda en borrador
  // hasta que tenga al menos un capitulo. Se publica con UpdateBook cuando ya
  // hay contenido. Borrarlo, en cambio, se puede siempre.
  rpc CreateBook(CreateBookRequest) returns (BookResponse) {
    option (google.api.http) = {
      post: "/v1/books"
      body: "*"
    };
  }
  // Listado publico y paginado: solo devuelve libros publicados, con o sin
  // token. Para ver los propios en cualquier estado esta ListMyBooks.
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse) {
    option (google.api.http) = {
      get: "/v1/books"
    };
  }
  // Los libros del autor autenticado, en cualquier estado y TODOS de una vez:
  // este listado no se pagina, a diferencia del publico. Es el escritorio del
  // autor —su obra completa, que el ya sabe cuanta es— y quien lo dibuja
  // necesita el total sin ir pidiendo paginas.
  //
  // No recibe author_id a proposito: sale del token y no del cliente, que es
  // lo unico que impide pedir la obra inedita de otro. La ruta literal "mine"
  // gana contra {id} en el matcher del transcoder, asi que no choca con
  // GetBook.
  rpc ListMyBooks(ListMyBooksRequest) returns (ListMyBooksResponse) {
    option (google.api.http) = {
      get: "/v1/books/mine"
    };
  }
  // Devuelve el libro con sus capitulos.
  rpc GetBook(GetBookRequest) returns (BookDetailResponse) {
    option (google.api.http) = {
      get: "/v1/books/{id}"
    };
  }
  // Publicar (status: published) exige que el libro ya no este vacio. Que sus
  // capitulos esten publicados o no es decision del autor.
  rpc UpdateBook(UpdateBookRequest) returns (BookResponse) {
    option (google.api.http) = {
      patch: "/v1/books/{id}"
      body: "*"
    };
  }
  // Borra el libro y, por CASCADE, todos sus capitulos.
  rpc DeleteBook(DeleteBookRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/books/{id}"
    };
  }

  // --- content: capitulos -------------------------------------------------

  // Agrega un capitulo al libro. Es la unica forma de crear contenido, tanto
  // el primer capitulo como los siguientes.
  //
  // No puede nacer publicado si el libro no lo esta: ver UpdateChapter.
  rpc CreateChapter(CreateChapterRequest) returns (ChapterResponse) {
    option (google.api.http) = {
      post: "/v1/books/{book_id}/chapters"
      body: "*"
    };
  }
  rpc GetChapter(GetChapterRequest) returns (ChapterResponse) {
    option (google.api.http) = {
      get: "/v1/books/{book_id}/chapters/{id}"
    };
  }
  // Publicar un capitulo exige que el libro ya este publicado: en un libro que
  // no esta a la vista de nadie, marcar un capitulo como publico no significa
  // nada. Si no lo esta, responde FailedPrecondition.
  //
  // El orden de trabajo es entonces: crear el libro, escribirle capitulos en
  // borrador, publicar el libro (que solo exige que TENGA capitulos, no que
  // esten publicados) y despues ir publicandolos.
  //
  // Despublicar no tiene restriccion, y despublicar el LIBRO no degrada sus
  // capitulos: se quedan como estaban.
  rpc UpdateChapter(UpdateChapterRequest) returns (ChapterResponse) {
    option (google.api.http) = {
      patch: "/v1/books/{book_id}/chapters/{id}"
      body: "*"
    };
  }
  // Un libro en borrador se puede vaciar del todo. Lo que falla es dejar vacio
  // un libro publicado: primero hay que despublicarlo.
  rpc DeleteChapter(DeleteChapterRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/books/{book_id}/chapters/{id}"
    };
  }
  // Recibe TODOS los capitulos del libro en el orden deseado y les reasigna
  // position 1..N. La ruta literal "reorder" gana contra {id} en el matcher
  // del transcoder, asi que no choca con GetChapter.
  rpc ReorderChapters(ReorderChaptersRequest) returns (ReorderChaptersResponse) {
    option (google.api.http) = {
      patch: "/v1/books/{book_id}/chapters/reorder"
      body: "*"
    };
  }

  // --- content: sagas -----------------------------------------------------

  rpc CreateSaga(CreateSagaRequest) returns (SagaResponse) {
    option (google.api.http) = {
      post: "/v1/sagas"
      body: "*"
    };
  }
  // Listado publico y paginado de sagas.
  rpc ListSagas(ListSagasRequest) returns (ListSagasResponse) {
    option (google.api.http) = {
      get: "/v1/sagas"
    };
  }
  // Las sagas del autor autenticado. Como en ListMyBooks, el author_id sale
  // del token y no de la peticion.
  rpc ListMySagas(ListMySagasRequest) returns (ListSagasResponse) {
    option (google.api.http) = {
      get: "/v1/sagas/mine"
    };
  }
  // Devuelve la saga con sus libros ya ordenados por position.
  rpc GetSaga(GetSagaRequest) returns (SagaDetailResponse) {
    option (google.api.http) = {
      get: "/v1/sagas/{id}"
    };
  }
  rpc UpdateSaga(UpdateSagaRequest) returns (SagaResponse) {
    option (google.api.http) = {
      patch: "/v1/sagas/{id}"
      body: "*"
    };
  }
  rpc DeleteSaga(DeleteSagaRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/sagas/{id}"
    };
  }
  // Vincular un libro no es un CRUD propio: es una accion sobre la saga.
  rpc AddBookToSaga(AddBookToSagaRequest) returns (SagaDetailResponse) {
    option (google.api.http) = {
      post: "/v1/sagas/{saga_id}/books"
      body: "*"
    };
  }
  rpc RemoveBookFromSaga(RemoveBookFromSagaRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/v1/sagas/{saga_id}/books/{book_id}"
    };
  }
  rpc ReorderSagaBooks(ReorderSagaBooksRequest) returns (SagaDetailResponse) {
    option (google.api.http) = {
      patch: "/v1/sagas/{saga_id}/books/reorder"
      body: "*"
    };
  }

  // --- content: generos ---------------------------------------------------

  // El catalogo completo de generos, para que el cliente arme el selector. Es
  // una lista fija: los generos no se crean por API, salen de la migracion.
  rpc ListGenres(ListGenresRequest) returns (ListGenresResponse) {
    option (google.api.http) = {
      get: "/v1/genres"
    };
  }
  // Reemplaza los generos del libro por los que vengan (maximo 4). No es un
  // PATCH parcial: la lista que llega es la lista que queda, y una lista vacia
  // deja el libro sin generos.
  //
  // Va aparte de UpdateBook porque en proto3 un campo repeated no distingue
  // "no lo mandes" de "dejalo vacio": dentro del PATCH no habria forma de
  // quitar todos los generos sin inventar un flag. Aqui la semantica es una
  // sola y no hace falta.
  rpc SetBookGenres(SetBookGenresRequest) returns (BookResponse) {
    option (google.api.http) = {
      put: "/v1/books/{book_id}/genres"
      body: "*"
    };
  }

  // --- interno: baja de cuenta -------------------------------------------

  // DeleteAuthorContent borra todo lo que cuelga de un usuario: sus libros
  // (con sus capitulos y sus generos) y sus sagas. Lo llama user-service
  // cuando alguien da de baja su cuenta, porque el CASCADE de Postgres no
  // cruza de una base de datos a otra.
  //
  // Es idempotente: sobre un usuario que ya no tiene nada devuelve ceros.
  //
  // Como ValidateSession en user-service, NO lleva anotacion google.api.http,
  // asi que no existe como endpoint REST, y ademas queda bloqueada en
  // envoy.yaml para que no se alcance por la ruta de passthrough de gRPC. El
  // unico que la llama es user-service, directo a library-service:50052.
  rpc DeleteAuthorContent(DeleteAuthorContentRequest) returns (DeleteAuthorContentResponse);
}

// --- Entidades -------------------------------------------------------------

// status: draft / published / archived.
message Book {
  string id = 1;
  string author_id = 2;
  string title = 3;
  string description = 4;
  string cover_url = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Cuantos capitulos PUBLICADOS tiene el libro, y es el mismo numero para
  // todos: un borrador todavia no es parte del libro, es material que el autor
  // no ha soltado. Asi chapter_count significa una sola cosa —cuanto hay para
  // leer— y no cambia segun quien pregunte.
  //
  // Ojo: al autor, GetBook si le devuelve sus borradores en la lista de
  // capitulos. Es a proposito, son dos preguntas distintas: cuanto hay
  // publicado y que tiene escrito.
  int32 chapter_count = 9;
  // Los generos del libro, entre 0 y 4. Se fijan al crearlo o con
  // SetBookGenres; UpdateBook no los toca.
  repeated Genre genres = 10;
  // Cuando se publico por PRIMERA vez, ausente si nunca. Es lo que distingue un
  // borrador recien escrito de uno que estuvo publicado y se retiro, y lo que
  // sirve para ordenar novedades.
  //
  // No se borra al despublicar ni se pisa al volver a publicar: es la fecha en
  // que la obra salio, no la del ultimo cambio de estado. Pisarla dejaria colar
  // un libro viejo en las novedades con solo despublicarlo y republicarlo.
  google.protobuf.Timestamp published_at = 11;
}

// Genre es una entrada del catalogo fijo de generos. slug es el identificador
// estable (el que se manda al crear un libro o al filtrar un listado) y name la
// etiqueta que se le muestra al lector.
message Genre {
  string slug = 1;
  string name = 2;
}

// status: draft / published.
message Chapter {
  string id = 1;
  string book_id = 2;
  string title = 3;
  string content = 4;
  int32 position = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Misma regla que la del libro: la primera vez que se publico, ausente si
  // nunca.
  google.protobuf.Timestamp published_at = 9;
}

message Saga {
  string id = 1;
  string author_id = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// --- Libros ----------------------------------------------------------------

message CreateBookRequest {
  string title = 1;
  string description = 2;
  string cover_url = 3;
  // draft (por defecto) / archived. published no se acepta al crear: el libro
  // nace vacio y un libro vacio no se publica.
  string status = 4;
  // El 5 lo ocupaba first_chapter, que se quito: los capitulos se crean por
  // CreateChapter. Reservado para que un cliente viejo no lo reutilice.
  reserved 5;
  reserved "first_chapter";
  // Slugs del catalogo (ver ListGenres), maximo 4 y sin repetir. Opcional: un
  // libro puede nacer sin generos y ponerselos despues con SetBookGenres.
  repeated string genres = 6;
}

message ListBooksRequest {
  // Paginacion 1-based. page_size por defecto 20, maximo 100.
  int32 page = 1;
  int32 page_size = 2;
  // Filtra por autor, pero solo entre sus libros publicados.
  string author_id = 3;
  // Reservado: este listado siempre es published. Solo se acepta ese valor.
  string status = 4;
  // Busqueda por titulo (case-insensitive, subcadena).
  string search = 5;
  // Filtra por un genero (su slug). Un libro entra si lo tiene entre los suyos.
  string genre = 6;
}

// Sin campo author_id: el autor es siempre el dueno del token. Aceptarlo del
// cliente seria justamente el agujero que este endpoint evita.
message ListMyBooksRequest {
  // El 1 y el 2 los ocupaban page y page_size: este listado ya no se pagina,
  // devuelve todo. Reservados para que no se reutilicen; con la validacion de
  // query params del gateway, un cliente viejo que siga mandando ?page= recibe
  // un 400 que lo dice, en vez de que se ignore en silencio.
  reserved 1, 2;
  reserved "page", "page_size";
  // Filtro opcional: draft / published / archived. Vacio trae los tres.
  string status = 3;
  string search = 4;
  string genre = 5;
}

// Sin page ni page_size: aqui total es cuantos libros vienen, que son todos.
message ListMyBooksResponse {
  repeated Book books = 1;
  int32 total = 2;
}

message ListBooksResponse {
  repeated Book books = 1;
  // Total de libros que cumplen el filtro, no cuantos trae esta pagina.
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetBookRequest {
  string id = 1;
}

message BookResponse {
  Book book = 1;
}

// El libro con sus capitulos. Un lector solo ve los capitulos publicados;
// el autor ve tambien los suyos en borrador.
message BookDetailResponse {
  Book book = 1;
  repeated Chapter chapters = 2;
}

// Los generos no estan aqui: se cambian con SetBookGenres.
message UpdateBookRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string cover_url = 4;
  optional string status = 5;
}

message DeleteBookRequest {
  string id = 1;
}

message DeleteResponse {
  bool success = 1;
}

// --- Capitulos -------------------------------------------------------------

message CreateChapterRequest {
  string book_id = 1;
  string title = 2;
  string content = 3;
  // draft (por defecto) / published. published solo se acepta si el libro ya
  // esta publicado.
  string status = 4;
  // Posicion deseada. Si se omite (o es 0), se agrega al final.
  int32 position = 5;
}

message GetChapterRequest {
  string book_id = 1;
  string id = 2;
}

message UpdateChapterRequest {
  string book_id = 1;
  string id = 2;
  optional string title = 3;
  optional string content = 4;
  optional string status = 5;
}

message DeleteChapterRequest {
  string book_id = 1;
  string id = 2;
}

// chapter_ids debe traer TODOS los capitulos del libro, en el orden deseado.
message ReorderChaptersRequest {
  string book_id = 1;
  repeated string chapter_ids = 2;
}

message ReorderChaptersResponse {
  repeated Chapter chapters = 1;
}

message ChapterResponse {
  Chapter chapter = 1;
}

// --- Sagas -----------------------------------------------------------------

message CreateSagaRequest {
  string title = 1;
  string description = 2;
}

message ListSagasRequest {
  // Paginacion 1-based. page_size por defecto 20, maximo 100.
  int32 page = 1;
  int32 page_size = 2;
  // Filtro opcional por autor.
  string author_id = 3;
  // Busqueda por titulo (case-insensitive, subcadena).
  string search = 4;
}

// Sin campo author_id: el autor sale del token.
message ListMySagasRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
}

message ListSagasResponse {
  repeated Saga sagas = 1;
  // Total de sagas que cumplen el filtro, no cuantas trae esta pagina.
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetSagaRequest {
  string id = 1;
}

message UpdateSagaRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
}

message DeleteSagaRequest {
  string id = 1;
}

message SagaResponse {
  Saga saga = 1;
}

message SagaDetailResponse {
  Saga saga = 1;
  // Libros de la saga, ordenados por su position dentro de ella.
  repeated Book books = 2;
}

message AddBookToSagaRequest {
  string saga_id = 1;
  string book_id = 2;
  // Si se omite (o es 0), el libro se agrega al final.
  int32 position = 3;
}

message RemoveBookFromSagaRequest {
  string saga_id = 1;
  string book_id = 2;
}

// book_ids debe traer TODOS los libros de la saga, en el orden deseado.
message ReorderSagaBooksRequest {
  string saga_id = 1;
  repeated string book_ids = 2;
}

// --- Generos ---------------------------------------------------------------

message ListGenresRequest {}

message ListGenresResponse {
  repeated Genre genres = 1;
  int32 total = 2;
}

// genres reemplaza la lista entera: lo que no venga, se quita. Maximo 4 y sin
// repetir.
message SetBookGenresRequest {
  string book_id = 1;
  repeated string genres = 2;
}

// --- Baja de cuenta --------------------------------------------------------

message DeleteAuthorContentRequest {
  string user_id = 1;
}

// Los conteos son para el log de quien lo llama: dejan rastro de cuanto se
// borro en una operacion que no tiene vuelta atras.
message DeleteAuthorContentResponse {
  int32 books_deleted = 1;
  int32 sagas_deleted = 2;
  // El 3 lo ocupaba saved_books_deleted, de la biblioteca del lector que salio
  // de este servicio. Reservado para que el numero no se reutilice: el mismo
  // contrato lo compila user-service por su lado.
  reserved 3;
  reserved "saved_books_deleted";
}
